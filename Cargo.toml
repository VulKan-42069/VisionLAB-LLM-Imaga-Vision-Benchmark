[package]
name = "visionlab"
version = "0.1.0"
edition = "2024"
description = "LLM Vision Benchmark Studio - Test and benchmark vision model capabilities"
authors = ["Amir"]

[dependencies]
# GUI
slint = { version = "1.13", features = ["renderer-skia"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Image loading, overlays, and fonts
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Video
ffmpeg-sidecar = "2"

# Dialogs, secrets, clipboard
rfd = "0.15"
keyring = { version = "3", features = ["windows-native"] }
arboard = "3"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
base64 = "0.22"
once_cell = "1"

[dev-dependencies]
keyring = { version = "3", features = ["windows-native"] }

[build-dependencies]
slint-build = "1.13"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
